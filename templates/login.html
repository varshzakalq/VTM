<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>vtm — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/screens.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 40px;
    }
    .auth-container {
      max-width: var(--app-w);
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }
    .auth-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-top: 28px;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 999px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(15, 26, 48, .08);
    }
    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: 999px;
      padding: 4px 18px;
      margin-bottom: 14px;
      transition: all .2s;
    }
    .input-box:focus-within {
      background: #fff;
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(14, 20, 36, .08);
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      padding: 10px 0;
      font-family: inherit;
    }
    .input-box .ico {
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    .auth-btn {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }
    .auth-btn:active { transform: scale(.98); }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; }
    .auth-alert {
      background: rgba(229, 72, 77, .12);
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-alert.visible { display: block; }
  </style>
</head>
<body>

<div class="auth-container">
  <!-- Brand Header -->
  <header class="home-head">
    <div class="brand">
      
      <h1>jus.. a formality</h1>
    </div>
  </header>

  <p class="greeting" id="greetingText">Good evening</p>
  <h2 class="hero-title">Find your rhythm.</h2>

  <div class="auth-card">
    <!-- Tab Switcher -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tabLogin" onclick="showForm('login')">Sign In</button>
      <button type="button" class="auth-tab" id="tabRegister" onclick="showForm('register')">Create Account</button>
    </div>

    <div class="auth-alert" id="authAlert" role="alert"></div>

    <!-- 1. SIGN IN FORM (Username + Password only) -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="loginUsername" placeholder="Username or Email" required autofocus>
      </div>

      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span>Sign In</span>
      </button>
    </form>

    <!-- 2. REGISTER FORM (Username + Extra Email Field + Password) -->
    <form id="formRegister" onsubmit="handleRegister(event)" style="display: none;">
      <!-- Username -->
      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="regUsername" placeholder="Choose a Username" required>
      </div>

      <!-- Extra Field: Email -->
      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="regEmail" placeholder="Email Address" required>
      </div>

      <!-- Password -->
      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="regPassword" placeholder="Create a Password" required>
      </div>

      <button type="submit" class="auth-btn" id="regBtn">
        <span>Create Account</span>
      </button>
    </form>

  </div>
</div>

<script>
  (function setGreeting() {
    const hour = new Date().getHours();
    let text = 'Good evening';
    if (hour < 12) text = 'Good morning';
    else if (hour < 18) text = 'Good afternoon';
    const el = document.getElementById('greetingText');
    if (el) el.textContent = text;
  })();

  function showForm(mode) {
    const alertBox = document.getElementById('authAlert');
    alertBox.classList.remove('visible');
    alertBox.textContent = '';

    if (mode === 'login') {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('formLogin').style.display = 'block';
      document.getElementById('formRegister').style.display = 'none';
      document.getElementById('loginUsername').focus();
    } else {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('formLogin').style.display = 'none';
      document.getElementById('formRegister').style.display = 'block';
      document.getElementById('regUsername').focus();
    }
  }

  // Handle Login (Username + Password)
  async function handleLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById('authAlert');
    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    alertBox.classList.remove('visible');
    btn.disabled = true;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/';
      } else {
        alertBox.textContent = data.error || 'Invalid credentials';
        alertBox.classList.add('visible');
      }
    } catch {
      alertBox.textContent = 'Server connection error.';
      alertBox.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  }

  // Handle Register (Username + Email + Password)
  async function handleRegister(e) {
    e.preventDefault();
    const alertBox = document.getElementById('authAlert');
    const btn = document.getElementById('regBtn');
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    alertBox.classList.remove('visible');
    btn.disabled = true;

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/';
      } else {
        alertBox.textContent = data.error || 'Registration failed';
        alertBox.classList.add('visible');
      }
    } catch {
      alertBox.textContent = 'Server connection error.';
      alertBox.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
