<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>vtm — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/screens.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 40px;
    }
    .auth-container {
      max-width: var(--app-w);
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }
    .auth-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-top: 28px;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 999px;
      text-align: center;
      transition: all .2s;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(15, 26, 48, .08);
    }
    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: 999px;
      padding: 4px 18px;
      margin-bottom: 14px;
      transition: all .2s;
    }
    .input-box:focus-within {
      background: #fff;
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(14, 20, 36, .08);
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      padding: 10px 0;
      font-family: inherit;
    }
    .input-box .ico {
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    .auth-btn {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      transition: transform .15s, opacity .15s;
    }
    .auth-btn:active {
      transform: scale(.98);
    }
    .auth-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .auth-alert {
      background: rgba(229, 72, 77, .12);
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-alert.visible {
      display: block;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <!-- Brand Header -->
  <header class="home-head">
    <div class="brand">
      <span class="logo">
        <svg class="ico" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20" fill="currentColor"/></svg>
      </span>
      <h1>vtm</h1>
    </div>
  </header>

  <p class="greeting" id="greetingText">Good evening</p>
  <h2 class="hero-title">Find your rhythm.</h2>

  <!-- Login / Register Card -->
  <div class="auth-card">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tabLogin" onclick="switchMode('login')">Sign In</button>
      <button type="button" class="auth-tab" id="tabRegister" onclick="switchMode('register')">Create Account</button>
    </div>

    <div class="auth-alert" id="authAlert" role="alert"></div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" autofocus>
      </div>

      <div class="input-box">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <span id="btnText">Sign In</span>
      </button>
    </form>
  </div>
</div>

<script>
  let mode = 'login';

  (function setGreeting() {
    const hour = new Date().getHours();
    let text = 'Good evening';
    if (hour < 12) text = 'Good morning';
    else if (hour < 18) text = 'Good afternoon';
    const el = document.getElementById('greetingText');
    if (el) el.textContent = text;
  })();

  function switchMode(newMode) {
    mode = newMode;
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const btnText = document.getElementById('btnText');
    const authAlert = document.getElementById('authAlert');

    authAlert.classList.remove('visible');
    authAlert.textContent = '';

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      btnText.textContent = 'Sign In';
      document.getElementById('password').autocomplete = 'current-password';
    } else {
      tabLogin.classList.remove('active');
      tabRegister.classList.add('active');
      btnText.textContent = 'Create Account';
      document.getElementById('password').autocomplete = 'new-password';
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const alertBox = document.getElementById('authAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    alertBox.classList.remove('visible');
    alertBox.textContent = '';

    if (!username || !password) {
      alertBox.textContent = 'Please fill in both fields.';
      alertBox.classList.add('visible');
      return;
    }

    submitBtn.disabled = true;
    const originalText = btnText.textContent;
    btnText.textContent = 'Please wait...';

    const endpoint = mode === 'login' ? '/api/login' : '/api/register';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok) {
        // Successful login: Reload to '/' which now serves index.html
        window.location.href = '/';
      } else {
        alertBox.textContent = data.error || 'Authentication failed.';
        alertBox.classList.add('visible');
      }
    } catch (err) {
      alertBox.textContent = 'Network or server error. Please try again.';
      alertBox.classList.add('visible');
    } finally {
      submitBtn.disabled = false;
      btnText.textContent = originalText;
    }
  }
</script>

</body>
</html>
