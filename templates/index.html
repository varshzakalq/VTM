<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VTM</title>
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/screens.css">
  <link rel="stylesheet" href="static/css/player.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19,5 9,12 19,19" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><rect x="4.5" y="5" width="2.5" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5,5 15,12 5,19" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><rect x="17" y="5" width="2.5" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-queue-add" viewBox="0 0 24 24"><path d="M3 6h12M3 12h8M3 18h8M17 13v7M13.5 16.5h7"/></symbol>
  <symbol id="i-playlist-add" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="3"/><path d="M20 8v9a4 4 0 0 1-4 4H8"/><path d="M9.5 6.5v6M6.5 9.5h6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></g></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
</svg>

<main class="app">

  <!-- HOME: playlists -->
  <section id="screen-home" class="screen active">
    <header class="home-head">
      
    </header>
    <p class="greeting" id="greeting" data-username="{{ username }}"></p>
    <h2 class="hero-title">Find your rhythm.</h2>
    <div class="section-head"><h3>Your playlists</h3><span id="playlist-count" class="count">0</span></div>
    <div id="playlist-grid" class="pl-grid"></div>
  </section>

  <!-- LIKED SONGS (rendered by screens.js) -->
  <section id="screen-liked" class="screen"></section>

  <!-- SEARCH (also the playlist builder) -->
  <section id="screen-search" class="screen">
    <div class="search-head">
      <div class="search-box">
        <svg class="ico"><use href="#i-search"/></svg>
        <input type="text" id="searchInput" placeholder="Search song or artist" autocomplete="off" />
        <button class="search-btn" id="searchBtn">Search</button>
      </div>
      <div id="builderBanner" class="builder-banner" hidden></div>
    </div>
    <div id="search-results" class="song-list"></div>
  </section>

  <!-- PLAYLIST DETAIL (rendered by screens.js) -->
  <section id="screen-playlist" class="screen"></section>

</main>

<!-- Dock: mini player + bottom navigation -->
<div class="dock">
  <div class="player-card" id="miniPlayer">

    <!-- Up Next dropdown (opens upward) -->
    <div class="queue-drop" id="queueDrop">
      <div class="qd-head">
        <div><strong>Up Next</strong> <span class="qd-meta" id="queue-meta">0/30</span></div>
        <div class="qd-tools">
          <button class="mini-pill" data-action="save-queue">Save as playlist</button>
          <button class="mini-pill" data-action="clear-queue">Clear</button>
        </div>
      </div>
      <div id="queue-list" class="qd-list"></div>
    </div>

    <!-- Row above the seek bar -->
    <div class="pb-top">
      <button id="queue-toggle-btn" class="upnext-btn" aria-expanded="false" aria-controls="queueDrop">
        <span class="chev"><svg class="ico"><use href="#i-chevron-down"/></svg></span>
        <span>Up Next</span>
        <span id="queue-count" class="count">0</span>
      </button>
      <button id="auto-queue-btn" class="toggle active" aria-pressed="true" title="Add similar songs automatically">
        <span class="switch"></span>
        <span class="toggle-label">Auto Queue: ON</span>
      </button>
    </div>

    <input type="range" id="seekBar" class="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
    <div class="mini-row">
      <img id="currentThumb" alt="">
      <div class="song-info">
        <div id="currentTitle" class="song-title">Select a song to play</div>
        <div id="currentArtist" class="song-artist">--</div>
      </div>
      <button class="ctrl" id="prevBtn" aria-label="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
      <button class="ctrl play-pause" id="playPauseBtn" aria-label="Play or pause"><svg class="ico"><use href="#i-play"/></svg></button>
      <button class="ctrl" id="nextBtn" aria-label="Next"><svg class="ico"><use href="#i-next"/></svg></button>
    </div>
    <audio id="audioPlayer" autoplay></audio>
  </div>

  <nav class="bottom-nav" aria-label="Main">
    <button class="nav-btn active" data-nav="home"><span class="nav-ico"><svg class="ico"><use href="#i-home"/></svg></span><span class="nav-label">Home</span></button>
    <button class="nav-btn" data-nav="liked"><span class="nav-ico"><svg class="ico"><use href="#i-heart"/></svg></span><span class="nav-label">Saved Songs</span></button>
    <button class="nav-btn" data-nav="search"><span class="nav-ico"><svg class="ico"><use href="#i-search"/></svg></span><span class="nav-label">Search</span></button>
  </nav>
</div>

<!-- Full player -->
<div class="full-player" id="full-player" aria-hidden="true">
  <button class="fp-close" id="fpClose" aria-label="Close player"><svg class="ico"><use href="#i-chevron-down"/></svg></button>

  <div class="u-cover" id="uCover">
    <div class="u-meta">
      <h3 id="fpTitle">Nothing playing</h3>
      <p id="fpArtist">--</p>
    </div>
  </div>

  <div class="arc-wrap">
    <svg id="arc" viewBox="0 0 320 175">
      <path d="M14 14A146 146 0 0 0 306 14" class="arc-track"/>
      <path id="arcProgress" d="M14 14A146 146 0 0 0 306 14" class="arc-progress" pathLength="100" stroke-dasharray="0 100"/>
      <circle id="arcKnob" cx="14" cy="14" r="8" class="arc-knob"/>
    </svg>
  </div>
  <div class="fp-time" id="fpTime">0:00 / 0:00</div>

  <div class="fp-actions">
    <button class="fp-act" id="fpLikeBtn" aria-label="Like"><svg class="ico"><use href="#i-heart"/></svg></button>
    <button class="fp-act" id="fpPlaylistBtn" aria-label="Add to playlist"><svg class="ico"><use href="#i-playlist-add"/></svg></button>
  </div>

  <div class="fp-controls">
    <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle"><svg class="ico"><use href="#i-shuffle"/></svg></button>
    <div class="fp-pill">
      <button class="ctrl" id="fpPrevBtn" aria-label="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
      <button class="fp-play" id="fpPlayBtn" aria-label="Play or pause"><svg class="ico"><use href="#i-play"/></svg></button>
      <button class="ctrl" id="fpNextBtn" aria-label="Next"><svg class="ico"><use href="#i-next"/></svg></button>
    </div>
    <button class="icon-btn" id="repeatBtn" aria-label="Repeat"><svg class="ico"><use href="#i-repeat"/></svg></button>
  </div>
</div>

<!-- Bottom sheet (new playlist / add to playlist) -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet-grab"></div>
  <h3 id="sheetTitle"></h3>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Scripts: order matters (each file only uses what is loaded above it, or at call time) -->
<script src="static/js/utils.js"></script>
<script src="static/js/state.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/queue.js"></script>
<script src="static/js/playlists.js"></script>
<script src="static/js/tiles.js"></script>
<script src="static/js/screens.js"></script>
<script src="static/js/player.js"></script>
<script src="static/js/main.js"></script>
</body>
</html>
<script>
  async function checkAuth() {
    const res = await fetch('/api/auth/status');
    const data = await res.json();
    if (!data.authenticated) {
        document.getElementById('login-modal').style.display = 'flex';
    } else {
        document.getElementById('login-modal').style.display = 'none';
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;

    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    if (res.ok) {
        document.getElementById('login-modal').style.display = 'none';
        location.reload();
    } else {
        const error = await res.json();
        alert(error.error || 'Login failed');
    }
}

document.addEventListener('DOMContentLoaded', checkAuth);
</script>
