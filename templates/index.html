<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="logo">▶</span><h1>VTM</h1></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search song title or artist..." autocomplete="off" />
        <button class="search-btn" id="searchBtn">Search</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <div class="section-head"><h2>Search Results</h2></div>
      <div id="search-results" class="song-list"></div>
    </section>

    <div class="grid">
      <section>
        <div class="section-head">
          <h2>Up Next</h2>
          <button id="auto-queue-btn" class="toggle active" aria-pressed="true" title="Automatically add similar songs when the queue runs low">
            <span class="switch"></span>
            <span class="toggle-label">Auto Queue: ON</span>
          </button>
        </div>
        <div id="queue-list" class="song-list"></div>
      </section>

      <section>
        <div class="section-head"><h2>Liked Songs</h2></div>
        <div id="liked-songs-list" class="song-list"></div>
      </section>
    </div>
  </main>

  <!-- Bottom player -->
  <div class="player-bar">
    <div class="now-playing">
      <img id="currentThumb" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Cover" />
      <div class="song-info">
        <div id="currentTitle" class="song-title">Select a song to play</div>
        <div id="currentArtist" class="song-artist">--</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl" id="prevBtn" aria-label="Previous">⏮</button>
      <audio id="audioPlayer" controls autoplay></audio>
      <button class="ctrl" id="nextBtn" aria-label="Next">⏭</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
